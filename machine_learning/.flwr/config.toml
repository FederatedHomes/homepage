[superlink]
default = "local"

[superlink.supergrid]
address = "supergrid.flower.ai"

# Development-only local deployment profile.
[superlink.local]
address = ":local:"

[superlink.local-deployment]
address = "superlink:9093"
insecure = true

# Production Docker profile. The trainer mounts the project at /app, so the
# production CA is available at /app/certificates/prod/tls/ca.crt.
# The address must match a DNS name or IP covered by superlink.crt.
# This deployment uses 192.168.0.172 for the SuperLink Control API.
[superlink.production-deployment]
address = "192.168.0.172:9093"
root-certificates = "/app/certificates/prod/tls/ca.crt"
